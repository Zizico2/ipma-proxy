[package]
name = "ipma-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
dotenvy = "0.15.7"
moka = { version = "0.12.16", features = ["future"] }
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "http2"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tonic = { version = "0.14.9", features = ["gzip"] }
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tonic-reflection = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost = "0.14.4"
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
axum = "0.8"
flate2 = "1"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
