[workspace]
members = ["crates/*"]
default-members = ["crates/ipma-proxy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = "1"
ipma-open-data-client = { git = "https://github.com/Zizico2/ipma-openapi.git", rev = "781c45b14b7e36c0fb9239be338c9222e761d537" }
futures-util = "0.3"
geojson-geobuf = { path = "crates/geojson-geobuf", version = "0.1.0" }
ipma-proto = { git = "https://github.com/Zizico2/ipma-proto.git", rev = "e733ded6d18495fbd0a2279bc983ed37cc3e5826" }
ipma-service = { path = "crates/ipma-service", version = "0.1.0" }

anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
dotenvy = "0.15.7"
flate2 = "1"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "http2"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-reflection = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
